he launch is flagged at risk before anyone says so","functions":["Operations and delivery","Customer success and service"],"industries":["Digital Agencies"],"persona":"COO","tier":"Not tiered","built":true},{"id":"US-85","slug":"us-85-webinar-follow-up","title":"Everyone who attended the webinar is followed up, and those who asked a question are called first","functions":["Inside Sales / Demand Generation","Marketing"],"industries":["Martech"],"persona":"Head of Marketing","tier":"Not tiered","built":true},{"id":"US-86","slug":"us-86-was-promised-demos-checked","title":"What was promised in the demos is checked against the contract before it goes out","functions":["Sales"],"industries":["Software sales"],"persona":"Head of Sales","tier":"Not tiered","built":true},{"id":"US-87","slug":"us-87-investor-asks","title":"What an investor asked for on the last call is ready before the next one","functions":["Founder's Office","Leadership"],"industries":["Venture Funded Startups"],"persona":"Founder","tier":"Not tiered","built":true},{"id":"US-88","slug":"us-88-technician-site","title":"A technician's message from a customer's site becomes the parts request, the return visit and the customer's update","functions":["Operations and delivery"],"industries":["Field operations"],"persona":"COO","tier":"Not tiered","built":true},{"id":"US-89","slug":"us-89-supplier-confirmation-never-came","title":"The supplier's dispatch confirmation never came, and production hears before the line stops","functions":["Operations and delivery"],"industries":["Manufacturing"],"persona":"COO","tier":"Not tiered","built":true},{"id":"US-90","slug":"us-90-client-decision-date-passes","title":"A client said they would decide by the fifteenth, and the sixteenth does not pass unnoticed","functions":["Sales","Founder's Office"],"industries":["Professional services"],"persona":"Founder","tier":"Not tiered","built":true},{"id":"US-91","slug":"us-91-friday-update-missing","title":"The Friday update a delivery lead always sends does not come, and someone asks why that evening","functions":["Operations and delivery","Leadership"],"industries":["Technology services"],"persona":"COO","tier":"Not tiered","built":true},{"id":"US-92","slug":"us-92-in-progress-task-stalled","title":"A month-end task says \"in progress\", but nothing has moved on it for a week, and finance hears before the close","functions":["Finance"],"industries":["Any industry"],"persona":"CFO","tier":"Not tiered","built":true},{"id":"US-93","slug":"us-93-meeting-decision-no-action","title":"A decision taken in the leadership meeting shows no sign of happening anywhere, and its owner is asked before the next one","functions":["Leadership","Sales"],"industries":["B2B SaaS"],"persona":"CEO","tier":"Not tiered","built":true},{"id":"US-94","slug":"us-94-purchase-order-never-followed","title":"Work started on a verbal yes, and the purchase order that should have followed has not come","functions":["Finance","Sales"],"industries":["IT Services"],"persona":"CFO","tier":"Not tiered","built":true},{"id":"US-95","slug":"us-95-project-week-against-plan","title":"One project's week, set against its plan, reaches the COO without anyone writing it","functions":["Operations and delivery","Leadership"],"industries":["Digital Agencies"],"persona":"COO","tier":"Not tiered","built":true},{"id":"US-96","slug":"us-96-follow-through-by-team","title":"How each team kept its promises this month, by person, read from the record rather than from memory","functions":["Leadership","People"],"industries":["Any industry"],"persona":"CEO","tier":"Not tiered","built":true},{"id":"US-97","slug":"us-97-what-changed-before-board","title":"What changed in the company's picture since the last board meeting, ready before the founder writes a word","functions":["Board","Founder's Office","Strategy"],"industries":["Venture Funded Startups"],"persona":"Founder","tier":"Not tiered","built":true},{"id":"US-98","slug":"us-98-commitments-page-by-team","title":"One page leadership can open any day: what was promised, what is late and what is at risk, by team","functions":["Leadership","Operations and delivery"],"industries":["Any industry"],"persona":"COO","tier":"Not tiered","built":true},{"id":"US-99","slug":"us-99-month-with-its-reasons","title":"The month's figures reach the CFO with the reasons behind them, from the systems where the reasons live","functions":["Finance","Leadership"],"industries":["Professional services"],"persona":"CFO","tier":"Not tiered","built":true},{"id":"US-100","slug":"us-100-competitor-raises-round","title":"A competitor has raised a new round, and sales, marketing and the founder each hear what it means for them that morning","functions":["Strategy","Marketing","Sales"],"industries":["B2B SaaS","Venture Funded Startups"],"persona":"Founder","tier":"Not tiered","built":true},{"id":"US-101","slug":"us-101-competitor-round-your-segment","title":"A competitor's new round names an expansion into your segment, and the accounts there are called before the competitor calls them","functions":["Strategy","Sales"],"industries":["Martech"],"persona":"CEO","tier":"Not tiered","built":true},{"id":"US-102","slug":"us-102-competitor-sales-head-your-region","title":"A competitor appoints a head of sales in your region, and your accounts there are reviewed before their first meeting is booked","functions":["Sales","Strategy"],"industries":["B2B sales-led"],"persona":"CEO","tier":"Not tiered","built":true},{"id":"US-103","slug":"us-103-competitor-wins-your-customer","title":"A competitor announces a customer win, the customer is yours, and finance sees what is at risk before the renewal","functions":["Finance","Customer success and service"],"industries":["B2B SaaS"],"persona":"CFO","tier":"Not tiered","built":true}],"functions":["Board","Compliance and governance","Customer success and service","Engineering","Finance","Founder's Office","IT and security","Inside Sales / Demand Generation","Internal Audit","Leadership","Marketing","Operations and delivery","People","Product","Sales","Strategy"],"industries":["Any industry","B2B SaaS","B2B sales-led","B2C","D2C","Digital Agencies","Field operations","IT Services","Manufacturing","Martech","Professional services","SME","Software sales","Technology services","Venture Funded Startups"],"personas":["CEO","CFO","COO","Director","Founder","Head of Customer Success","Head of Marketing","Head of Sales"],"tiers":["LEAD","NEVER LEAD","Not tiered","SUPPORT"],"built":103};
var F = { functions: [], industries: [], personas: [], tiers: [], built: 'all', q: '' };
var bar = document.getElementById('bar'), list = document.getElementById('list');
var full = document.getElementById('full'), frame = full.querySelector('iframe'), ftitle = full.querySelector('.ft');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c] }) }

// How many stories a chip would leave if it were the only thing added to the current filters.
function countFor(key, val) { return D.stories.filter(function (s) { return keep(s, key, val) }).length }

function keep(s, addKey, addVal) {
  var f = { functions: F.functions.slice(), industries: F.industries.slice(), personas: F.personas.slice(), tiers: F.tiers.slice() };
  if (addKey && f[addKey].indexOf(addVal) < 0) f[addKey] = f[addKey].concat([addVal]);
  // Within a facet the values are OR; across facets they are AND.
  if (f.functions.length && !f.functions.some(function (v) { return s.functions.indexOf(v) > -1 })) return false;
  if (f.industries.length && !f.industries.some(function (v) { return s.industries.indexOf(v) > -1 })) return false;
  if (f.personas.length && f.personas.indexOf(s.persona) < 0) return false;
  if (f.tiers.length && f.tiers.indexOf(s.tier) < 0) return false;
  if (F.built === 'built' && !s.built) return false;
  if (F.built === 'not' && s.built) return false;
  if (F.q) { var hay = (s.id + ' ' + s.title + ' ' + s.persona + ' ' + s.functions.join(' ') + ' ' + s.industries.join(' ')).toLowerCase(); if (hay.indexOf(F.q) < 0) return false }
  return true;
}

function chipRow(label, key, values) {
  var html = '<div class="frow"><div class="flab">' + esc(label) + '</div><div class="chips">';
  for (var i = 0; i < values.length; i++) {
    var v = values[i], on = F[key].indexOf(v) > -1, n = countFor(key, v);
    html += '<button class="chip' + (on ? ' on' : '') + '" data-k="' + esc(key) + '" data-v="' + esc(v) + '">' + esc(v) + '<small>' + n + '</small></button>';
  }
  return html + '</div></div>';
}

function drawBar() {
  var builtRow = '<div class="frow"><div class="flab">Built</div><div class="chips">' +
    [['all', 'All'], ['built', 'Built'], ['not', 'Not built']].map(function (o) {
      return '<button class="chip' + (F.built === o[0] ? ' on' : '') + '" data-built="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div></div>';
  bar.innerHTML = chipRow('Function', 'functions', D.functions) + chipRow('Industry', 'industries', D.industries) +
    chipRow('Persona', 'personas', D.personas) + chipRow('Tier', 'tiers', D.tiers) + builtRow +
    '<div class="tools"><input id="q" placeholder="Search a story by ID, title or persona" value="' + esc(F.q) + '">' +
    '<button id="clear">Clear filters</button><span class="count" id="count"></span></div>';

  bar.querySelectorAll('.chip[data-k]').forEach(function (c) {
    c.onclick = function () {
      var k = c.dataset.k, v = c.dataset.v, at = F[k].indexOf(v);
      if (at > -1) F[k].splice(at, 1); else F[k].push(v);
      draw();
    };
  });
  bar.querySelectorAll('.chip[data-built]').forEach(function (c) {
    c.onclick = function () { F.built = c.dataset.built; draw() };
  });
  var q = document.getElementById('q');
  q.oninput = function () { F.q = q.value.trim().toLowerCase(); drawList(); drawBar2() };
  document.getElementById('clear').onclick = function () {
    F = { functions: [], industries: [], personas: [], tiers: [], built: 'all', q: '' }; draw();
  };
}
// Redraw only the counts and the count line, so typing in the box does not steal focus.
function drawBar2() {
  bar.querySelectorAll('.chip[data-k]').forEach(function (c) {
    var s = c.querySelector('small'); if (s) s.textContent = countFor(c.dataset.k, c.dataset.v);
  });
  setCount();
}
function setCount() {
  var n = D.stories.filter(function (s) { return keep(s) }).length;
  var el = document.getElementById('count');
  if (el) el.innerHTML = '<b>' + n + '</b> of ' + D.stories.length + ' stories';
}

function drawList() {
  var shown = D.stories.filter(function (s) { return keep(s) });
  if (!shown.length) { list.innerHTML = '<div class="empty">No story matches these filters. Try removing one.</div>'; return }
  list.innerHTML = '<div class="grid">' + shown.map(function (s) {
    var tags = s.functions.concat(s.industries).map(function (t) { return '<span class="tag">' + esc(t) + '</span>' }).join('');
    var inList = PICK.indexOf(s.slug) > -1;
    return '<div class="card' + (s.built ? '' : ' no') + (inList ? ' chosen' : '') + '" data-slug="' + esc(s.slug) + '">' +
      '<div class="top"><code>' + esc(s.id) + '</code>' + (s.built ? '' : '<span class="nb">not built yet</span>') +
        (s.built ? '<button class="pick' + (inList ? ' in' : '') + '" title="' + (inList ? 'Remove from the shortlist' : 'Add to the shortlist') + '">' + (inList ? '✓' : '+') + '</button>' : '') +
      '</div>' +
      '<b>' + esc(s.title) + '</b>' +
      '<div class="meta"><span class="tag p">' + esc(s.persona) + '</span>' + (s.tier ? '<span class="tag t">' + esc(s.tier) + '</span>' : '') + tags + '</div>' +
      '</div>';
  }).join('') + '</div>';
  list.querySelectorAll('.card:not(.no)').forEach(function (c) {
    c.onclick = function () { location.hash = '#/story/' + c.dataset.slug };
    var p = c.querySelector('.pick');
    if (p) p.onclick = function (e) { e.stopPropagation(); toggle(c.dataset.slug) };
  });
}
// ---- the shortlist: pick stories, name the viewer and the company, export the folder --------
var PICK = [], busy = false, msg = '';
function toggle(slug) { var i = PICK.indexOf(slug); if (i > -1) PICK.splice(i, 1); else PICK.push(slug); msg = ''; drawList(); drawTray() }
function addShown() {
  D.stories.filter(function (s) { return keep(s) && s.built && PICK.indexOf(s.slug) < 0 }).forEach(function (s) { PICK.push(s.slug) });
  msg = ''; drawList(); drawTray();
}
function titleOf(slug) { var s = D.stories.filter(function (x) { return x.slug === slug })[0]; return s ? s.id : slug }

function drawTray() {
  var tray = document.getElementById('tray');
  var chips = PICK.map(function (slug) {
    return '<span class="pc">' + esc(titleOf(slug)) + '<button data-x="' + esc(slug) + '" title="Remove">×</button></span>';
  }).join('');
  var personas = ['CEO', 'Founder', 'Director', 'CFO', 'COO', 'Head of Sales', 'Head of Marketing', 'Head of Customer Success'];
  tray.innerHTML =
    '<h3>Shortlist · ' + PICK.length + (PICK.length === 1 ? ' story' : ' stories') + '</h3>' +
    (PICK.length ? '<div class="picked">' + chips + '</div>'
                 : '<div class="picked"><span class="tag">Nothing picked yet. Use + on a story, or Add all shown.</span></div>') +
    '<div class="cust">' +
      '<button class="lite" id="addshown">Add all shown</button>' +
      (PICK.length ? '<button class="lite" id="clearpick">Clear</button>' : '') +
      '<input id="vname" placeholder="Viewer’s name (optional)" value="' + esc(CUST.name) + '">' +
      '<select id="vpersona">' + personas.map(function (p) {
        return '<option' + (CUST.persona === p ? ' selected' : '') + '>' + esc(p) + '</option>' }).join('') + '</select>' +
      '<input id="vcompany" placeholder="Company name (optional)" value="' + esc(CUST.company) + '">' +
      '<button class="go" id="go"' + (PICK.length && !busy ? '' : ' disabled') + '>' + (busy ? 'Exporting…' : 'Export') + '</button>' +
    '</div>' + (msg ? '<p class="note ' + msgKind + '">' + msg + '</p>' : '<p class="note">Export writes a folder of these stories with the company and the viewer’s name swapped in. The originals never change.</p>');

  tray.querySelectorAll('.pc button').forEach(function (b) { b.onclick = function () { toggle(b.dataset.x) } });
  document.getElementById('addshown').onclick = addShown;
  var cp = document.getElementById('clearpick'); if (cp) cp.onclick = function () { PICK = []; msg = ''; drawList(); drawTray() };
  ['vname', 'vcompany'].forEach(function (id) {
    var el = document.getElementById(id);
    el.oninput = function () { CUST[id === 'vname' ? 'name' : 'company'] = el.value };
  });
  document.getElementById('vpersona').onchange = function (e) { CUST.persona = e.target.value };
  document.getElementById('go').onclick = runExport;
}

var CUST = { name: '', company: '', persona: 'CFO' }, msgKind = '';
function say(text, kind) { msg = text; msgKind = kind || ''; drawTray() }

function runExport() {
  if (!PICK.length || busy) return;
  busy = true; say('Building ' + PICK.length + ' ' + (PICK.length === 1 ? 'story' : 'stories') + '… this takes a minute or two.', '');
  fetch('export', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ids: PICK, name: CUST.name, company: CUST.company, persona: CUST.persona }) })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j } }) })
    .then(function (res) {
      if (!res.ok) { busy = false; say(esc(res.j.error || 'The export could not start.'), 'bad'); return }
      poll();
    })
    .catch(function () {
      busy = false;
      say('This page is not being served by tools/serve-stories.mjs, so it cannot start the export. Run it yourself:<br><code>node tools/export-demo.mjs --ids ' +
        esc(PICK.join(',')) + (CUST.persona ? ' --persona "' + esc(CUST.persona) + '"' : '') +
        (CUST.name ? ' --name "' + esc(CUST.name) + '"' : '') + (CUST.company ? ' --company "' + esc(CUST.company) + '"' : '') + '</code>', 'bad');
    });
}
function poll() {
  fetch('export/status').then(function (r) { return r.json() }).then(function (st) {
    if (st.running) { say('Building … ' + (st.built || 0) + ' of ' + (st.total || PICK.length) + ' done.', ''); setTimeout(poll, 1500); return }
    busy = false;
    if (st.ok) say('Done. The folder is <code>' + esc(st.folder || 'exports/') + '</code> — open start-demo.command (macOS) or start-demo.cmd (Windows) inside it.', 'ok');
    else say('The export failed. Last lines:<br><code>' + esc((st.lines || []).join(' · ')) + '</code>', 'bad');
  }).catch(function () { busy = false; say('Lost contact with the server.', 'bad') });
}

function draw() { drawBar(); drawList(); setCount(); drawTray() }

function open(slug) {
  var s = D.stories.filter(function (x) { return x.slug === slug })[0];
  if (!s || !s.built) { close(); return }
  ftitle.innerHTML = '<b>' + esc(s.id) + '</b> · ' + esc(s.title);
  frame.src = 'stories/' + slug + '/';
  full.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function close() {
  full.classList.remove('on'); frame.src = 'about:blank';
  document.body.style.overflow = '';
}
document.getElementById('back').onclick = function () { location.hash = '' };
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && full.classList.contains('on')) location.hash = '' });
function route() {
  var m = /^#\/story\/(.+)$/.exec(location.hash);
  if (m) open(m[1]); else close();
}
window.addEventListener('hashchange', route);
draw(); route();
</script>
